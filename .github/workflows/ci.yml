name: Splitmate CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      TEST_DB_URL: "jdbc:sqlserver://localhost:1433;databaseName=splitmate_test;encrypt=true;trustServerCertificate=true"
      TEST_DB_USERNAME: sa
      TEST_DB_PASSWORD: "Splitmate_CI_Only_2026!"

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: "Splitmate_CI_Only_2026!"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Splitmate_CI_Only_2026!' -C -b -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 30s

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Create test database
        env:
          SQLSERVER_CONTAINER: ${{ job.services.sqlserver.id }}
        run: |
          docker exec "$SQLSERVER_CONTAINER" \
            /opt/mssql-tools18/bin/sqlcmd \
            -S localhost -U sa -P "$TEST_DB_PASSWORD" \
            -C -b -Q "CREATE DATABASE splitmate_test"

      - name: Build and test Spring Boot
        env:
          SPRING_PROFILES_ACTIVE: test
        run: bash ./mvnw -B clean verify

      - name: Build backend Docker image
        run: docker build -t splitmate-backend:ci .

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Vue application
        run: npm run build

      - name: Build frontend Docker image
        env:
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
        run: |
          test -n "$GOOGLE_CLIENT_ID"
          docker build \
            --build-arg VITE_GOOGLE_CLIENT_ID="$GOOGLE_CLIENT_ID" \
            -t splitmate-frontend:ci .

  publish:
    name: Publish Docker Images
    needs: [backend, frontend]
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          printf '%s' "$GHCR_TOKEN" |
            docker login ghcr.io -u "$GHCR_USER" --password-stdin

      - name: Build and publish images
        env:
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
        run: |
          test -n "$GOOGLE_CLIENT_ID"

          IMAGE_PREFIX="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/splitmate"
          SOURCE_URL="https://github.com/$GITHUB_REPOSITORY"

          docker build \
            --label "org.opencontainers.image.source=$SOURCE_URL" \
            -t "${IMAGE_PREFIX}-backend:$GITHUB_SHA" .

          docker build \
            --build-arg VITE_GOOGLE_CLIENT_ID="$GOOGLE_CLIENT_ID" \
            --label "org.opencontainers.image.source=$SOURCE_URL" \
            -t "${IMAGE_PREFIX}-frontend:$GITHUB_SHA" ./frontend

          docker push "${IMAGE_PREFIX}-backend:$GITHUB_SHA"
          docker push "${IMAGE_PREFIX}-frontend:$GITHUB_SHA"
