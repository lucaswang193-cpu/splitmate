spring.application.name=splitmate-test
spring.config.import=optional:classpath:application-test-local.properties

## MS SQL test database configuration
spring.datasource.url=${TEST_DB_URL}
spring.datasource.username=${TEST_DB_USERNAME}
spring.datasource.password=${TEST_DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Hibernate
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=create
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT
jwt.secret=splitmate-test-development-secret-key-change-me-please
jwt.expiration-millis=86400000

# Test-only audience; real Google sign-in is not used in automated tests.
google.client-id=splitmate-test.apps.googleusercontent.com
