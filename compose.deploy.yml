name: splitmate

services:
  backend:
    container_name: splitmate-backend
    image: ghcr.io/lucaswang193-cpu/splitmate-backend:${IMAGE_TAG:?IMAGE_TAG is required}
    env_file:
      - .env.docker
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_DATA_REDIS_CONNECT_TIMEOUT: 2s
      SPRING_DATA_REDIS_TIMEOUT: 2s
      SPRING_DATA_REDIS_REPOSITORIES_ENABLED: "false"
    depends_on:
      redis:
        condition: service_healthy
    expose:
      - "8080"
    restart: unless-stopped

  frontend:
    container_name: splitmate-frontend
    image: ghcr.io/lucaswang193-cpu/splitmate-frontend:${IMAGE_TAG:?IMAGE_TAG is required}
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
  redis:
    image: redis:8-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped